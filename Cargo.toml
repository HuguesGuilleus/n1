[workspace]
members = ["n1_core", "n1_tool", "n1_html"]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["Hugues"]

[workspace.dependencies]
async-trait = "0.1"
base64 = "0.22.1"
bytes = "1.12.0"
hurl = "8.0.1"
hurl_core = "8.0.1"
rust-crypto = "0.2.36"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
urlencoding = "2.1.3"
